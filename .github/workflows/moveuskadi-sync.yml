name: Moveuskadi Public Transport Data Sync

on:
  schedule:
    # Moveuskadi regenerates GTFS feeds daily around 06:01 UTC (07:01 CET).
    # Scheduled on minute 27 to avoid GitHub Actions global runner congestion at :00 and :15.
    # Note: GitHub Actions scheduled cron jobs execute exclusively on the repository's default branch.
    - cron: '27 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Moveuskadi Operators & Schedules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/ingestion/requirements.txt'

      - name: Install Ingestion Dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/ingestion/requirements.txt
          pip install "psycopg[binary]>=3.1.18" "psycopg2-binary>=2.9.9"
          python3 -c "import psycopg; print('✓ Verified psycopg version:', psycopg.__version__)"

      - name: Run Pipeline Validation Tests
        run: |
          cd services/ingestion
          python3 -m pytest -v

      - name: Run Dynamic Moveuskadi Discovery & Ingestion
        working-directory: services/ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ocxcrxgagennmukuxnle.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: production
        run: |
          echo "Starting Moveuskadi Catalogue Discovery..."
          python3 -m src.cli discover
          
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL detected. Importing territorial boundaries into PostGIS..."
            python3 -m src.cli import-boundaries
          else
            echo "DATABASE_URL not configured yet. Skipping direct DB writes (discovery verified)."
          fi
