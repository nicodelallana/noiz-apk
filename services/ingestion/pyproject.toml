[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moveuskadi-ingestion"
version = "1.0.0"
description = "Automated Euskadi Public Transport Data Ingestion and Management Platform"
authors = [{ name = "Bizkaia Transit Core Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pyshp>=3.0.0",
    "gtfs-realtime-bindings>=3.0.0",
    "protobuf>=5.27.0",
    "defusedxml>=0.7.1",
    "apscheduler>=3.10.4",
    "supabase>=2.6.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.0",
]

[project.scripts]
moveuskadi-ingest = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
