name: bizkaia_transit
description: "App móvil para consultar transporte público de Bizkaia de un vistazo: viajes guardados, widgets, incidencias y planificador."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0

  # Backend & Local Storage
  supabase_flutter: ^2.5.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # Networking & Caching
  dio: ^5.4.3
  crypto: ^3.0.3

  # Widgets & Animations
  home_widget: ^0.6.0
  lottie: ^3.1.0

  # Models & Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  timezone: ^0.9.3
  maplibre_gl: ^0.27.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^5.1.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/fonts/SpaceGrotesk/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk/SpaceGrotesk-Variable.ttf
